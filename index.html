                    <div className="text-gray-600 mb-4 font-medium">So'zlar: {index + 1} / {vocabData.length}</div>
                    
                    <div className="relative w-80 h-64 cursor-pointer card-flip" onClick={() => setFlipped(!flipped)}>
                        <div className={`card-inner w-full h-full rounded-2xl shadow-xl flex items-center justify-center text-center p-6 bg-white border border-red-100 ${flipped ? 'flipped' : ''}`}>
                            
                            <div className="card-front flex flex-col items-center justify-center text-red-600 bg-white rounded-2xl w-full h-full">
                                <span className="text-5xl font-bold mb-2">{vocabData[index].zh}</span>
                                <p className="text-xs text-gray-400 absolute bottom-4">(O'girish uchun bosing)</p>
                            </div>
                            
                            <div className="card-back flex flex-col items-center justify-center bg-red-50 text-gray-800 rounded-2xl w-full h-full p-6">
                                <span className="text-2xl font-bold text-red-600 mb-4">{vocabData[index].pinyin}</span>
                                <div className="space-y-3 text-sm w-full text-left px-2">
                                    <div className="flex"><span className="font-bold text-blue-600 w-10 shrink-0">UZ:</span> <span className="font-medium">{vocabData[index].uz}</span></div>
                                    <div className="flex"><span className="font-bold text-red-600 w-10 shrink-0">RU:</span> <span className="font-medium">{vocabData[index].ru}</span></div>
                                    <div className="flex"><span className="font-bold text-green-600 w-10 shrink-0">EN:</span> <span className="font-medium">{vocabData[index].en}</span></div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div className="flex gap-4 mt-8">
                        <button onClick={prevCard} className="px-6 py-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-300 transition shadow">Oldingi</button>
                        <button onClick={nextCard} className="px-6 py-2 bg-red-600 text-white rounded-full hover:bg-red-700 transition shadow">Keyingi</button>
                    </div>
                </div>
            );
        };

        const Texts = () => {
            return (
                <div className="mt-6 max-w-4xl mx-auto px-4 fade-in">
                    {textsData.map((text, idx) => (
                        <div key={idx} className="bg-white rounded-xl shadow-md mb-8 overflow-hidden border-t-4 border-red-500">
                            <div className="bg-red-50 px-6 py-4">
                                <h3 className="text-xl font-bold text-red-800">{text.title}</h3>
                            </div>
                            <div className="p-6 divide-y divide-gray-100">
                                {text.content.map((line, lIdx) => (
                                    <div key={lIdx} className="py-6 flex flex-col md:flex-row gap-4">
                                        <div className="md:w-1/6 font-bold text-gray-600 whitespace-nowrap">
                                            {line.speaker}:
                                        </div>
                                        <div className="md:w-5/6">
                                            <p className="text-xl text-gray-800 mb-2 font-medium">{line.zh}</p>
                                            <p className="text-sm text-gray-500 italic mb-4">{line.pinyin}</p>
                                            <div className="bg-gray-50 p-4 rounded-lg space-y-3">
                                                <div className="flex gap-2">
                                                    <span className="font-bold text-blue-600 text-sm uppercase w-8 shrink-0">UZ</span>
                                                    <p className="text-sm text-gray-700">{line.uz}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <span className="font-bold text-red-600 text-sm uppercase w-8 shrink-0">RU</span>
                                                    <p className="text-sm text-gray-700">{line.ru}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <span className="font-bold text-green-600 text-sm uppercase w-8 shrink-0">FR</span>
                                                    <p className="text-sm text-gray-700">{line.fr}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const Grammar = () => {
            return (
                <div className="mt-6 max-w-4xl mx-auto px-4 fade-in">
                    <h2 className="text-3xl font-bold text-gray-800 mb-8 text-center">Grammatika (语法解释)</h2>
                    {grammarData.map((item, idx) => (
                        <div key={idx} className="bg-white rounded-2xl shadow-md border-t-4 border-red-500 p-6 md:p-8 mb-8 hover:shadow-lg transition-shadow duration-300">
                            <h3 className="text-2xl font-bold text-red-700 mb-4">{item.title}</h3>
                            <p className="text-gray-700 mb-6 text-lg leading-relaxed">{item.explanation}</p>
                            
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-100 mb-6">
                                <h4 className="font-bold text-gray-800 mb-3 text-lg flex items-center">
                                    <svg className="w-5 h-5 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Misollar (例子):
                                </h4>
                                <ul className="space-y-3">
                                    {item.examples.map((ex, i) => (
                                        <li key={i} className="text-gray-700 leading-relaxed flex items-start">
                                            <span className="text-red-500 font-bold mr-2">{i + 1}.</span> 
                                            <span>{ex}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {item.comparison && (
                                <div className="bg-blue-50 p-5 rounded-xl border border-blue-100 mt-6">
                                    <h4 className="font-bold text-blue-800 mb-4 text-lg border-b border-blue-200 pb-2">{item.comparison.title}</h4>
                                    <div className="mb-4">
                                        <span className="font-bold text-blue-900 block mb-1">O'xshash tomoni (相同点):</span>
                                        <p className="text-gray-800">{item.comparison.same}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold text-blue-900 block mb-2">Farqli tomonlari (不同点):</span>
                                        <ul className="space-y-2">
                                            {item.comparison.differences.map((diff, i) => (
                                                <li key={i} className="text-gray-800 flex items-start bg-white bg-opacity-50 p-2 rounded">
                                                    <span className="text-blue-500 font-bold mr-2 mt-0.5">•</span> 
                                                    <span>{diff}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        const Quiz = () => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selected, setSelected] = useState(null);

            const handleAnswer = (idx) => {
                if(selected !== null) return;
                setSelected(idx);
                if(idx === quizData[currentQ].answer) {
                    setScore(score + 1);
                }
                setTimeout(() => {
                    if (currentQ + 1 < quizData.length) {
                        setCurrentQ(currentQ + 1);
                        setSelected(null);
                    } else {
                        setShowResult(true);
                    }
                }, 800);
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelected(null);
            };

            if (showResult) {
                return (
                    <div className="max-w-xl mx-auto mt-12 bg-white rounded-2xl shadow-lg p-8 text-center fade-in border-t-4 border-red-500">
                        <h2 className="text-3xl font-bold text-gray-800 mb-4">Natija (结果)</h2>
                        <p className="text-5xl font-black text-red-600 mb-6">{score} / {quizData.length}</p>
                        <p className="text-lg text-gray-600 mb-8">
                            {score === quizData.length ? "Mukammal! 非常好！" : 
                             score > 10 ? "Yaxshi! 不错！" : "Yana takrorlang! 加油！"}
                        </p>
                        <button onClick={resetQuiz} className="px-8 py-3 bg-red-600 text-white rounded-full font-semibold hover:bg-red-700 transition shadow">
                            Qayta boshlash
                        </button>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto mt-8 px-4 fade-in">
                    <div className="bg-white rounded-2xl shadow-md overflow-hidden">
                        <div className="bg-red-50 px-6 py-4 flex justify-between items-center border-b border-red-100">
                            <span className="font-semibold text-red-800">Savol {currentQ + 1} / {quizData.length}</span>
                            <span className="text-sm text-gray-500">Ball: {score}</span>
                        </div>
                        <div className="p-8">
                            <h3 className="text-xl font-medium text-gray-800 mb-8">{quizData[currentQ].q}</h3>
                            <div className="space-y-3">
                                {quizData[currentQ].options.map((opt, idx) => {
                                    let btnClass = "w-full text-left px-6 py-4 rounded-xl border-2 transition-all duration-200 focus:outline-none ";
                                    if (selected === null) {
                                        btnClass += "border-gray-200 hover:border-red-400 hover:bg-red-50";
                                    } else {
                                        if (idx === quizData[currentQ].answer) {
                                            btnClass += "border-green-500 bg-green-50 text-green-700 font-semibold";
                                        } else if (idx === selected) {
                                            btnClass += "border-red-500 bg-red-50 text-red-700";
                                        } else {
                                            btnClass += "border-gray-200 opacity-50";
                                        }
                                    }
                                    return (
                                        <button 
                                            key={idx} 
                                            onClick={() => handleAnswer(idx)}
                                            className={btnClass}
                                            disabled={selected !== null}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('flashcards');

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-red-700 text-white shadow-lg pt-6 pb-4">
                        <div className="max-w-5xl mx-auto px-4 text-center">
                            <h1 className="text-3xl md:text-4xl font-black tracking-wide mb-2">喝着茶看京剧</h1>
                            <p className="text-lg md:text-xl font-medium text-red-100 uppercase tracking-widest">Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz</p>
                        </div>
                        
                        {/* Navigation */}
                        <div className="mt-6 flex justify-center overflow-x-auto px-2">
                            <div className="flex space-x-2 bg-red-800/50 p-1 rounded-full">
                                {[
                                    { id: 'flashcards', label: "生词闪卡 (Lug'at)", icon: 'flashcard' },
                                    { id: 'texts', label: "对话内容 (Matnlar)", icon: 'text' },
                                    { id: 'grammar', label: "语法解释 (Grammatika)", icon: 'grammar' },
                                    { id: 'quiz', label: "测试 (Test)", icon: 'quiz' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center px-4 py-2 rounded-full text-sm font-semibold transition-colors duration-200 ${
                                            activeTab === tab.id 
                                            ? 'bg-white text-red-700 shadow-sm' 
                                            : 'text-red-50 hover:bg-red-600/50'
                                        }`}
                                    >
                                        <SvgIcon name={tab.icon} />
                                        <span className="whitespace-nowrap">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow container mx-auto px-4 py-8 mb-12">
                        {activeTab === 'flashcards' && <Flashcards />}
                        {activeTab === 'texts' && <Texts />}
                        {activeTab === 'grammar' && <Grammar />}
                        {activeTab === 'quiz' && <Quiz />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-gray-800 text-gray-400 py-6 mt-auto">
                        <div className="max-w-5xl mx-auto px-4 text-center text-sm flex flex-col space-y-2">
                            <p className="font-semibold text-gray-300">HSK 4 Standard Course - Lesson 13</p>
                            <p>© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
                            <p>来帮助乌兹别克学生学习汉语</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
